<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>preview coalescing test harness</title>
  </head>
  <body>
    <div id="editor"></div>
    <div id="preview"></div>
    <button id="print"></button>
    <button id="refresh"></button>
    <button id="download"></button>
    <input id="load" type="file" />
    <input id="auto-refresh" type="checkbox" checked />
    <div id="status" hidden></div>
    <script type="module">
      import { startApp } from "/src/app/start-app.ts";
      import { createEditor } from "/src/adapters/editor.ts";
      import { downloadBook, loadBookFile } from "/src/adapters/file.ts";
      import { printBook } from "/src/adapters/printing.ts";

      // A stand-in for the real pagination adapter, substituted at the exact seam
      // issue #1's architecture designed for this (the three adapters are passed
      // in as plain arguments). It still does real, observable DOM work -- the
      // container's final content is what the test reads -- but its delay is
      // deterministic instead of depending on real Vivliostyle layout timing,
      // which is what proving issue #6's coalescing defect needs: a controllable
      // "slow" render and a controllable "fast" one, not a hope that a big enough
      // document reliably outlasts a keystroke on every machine this runs on.
      const fakePaginate = (container, html) => {
        const delay = html.includes("SLOW MARKER") ? 300 : 0;
        return new Promise((resolve) => {
          setTimeout(() => {
            container.replaceChildren();
            const div = document.createElement("div");
            div.textContent = html;
            container.appendChild(div);
            resolve({ pageCount: 1, pageSizes: [], overflowingPages: [] });
          }, delay);
        });
      };

      const editorContainer = document.getElementById("editor");
      const previewContainer = document.getElementById("preview");
      const printControl = document.getElementById("print");
      const refreshControl = document.getElementById("refresh");
      const autoRefreshControl = document.getElementById("auto-refresh");
      const statusContainer = document.getElementById("status");
      const downloadControl = document.getElementById("download");
      const loadControl = document.getElementById("load");

      const editor = startApp(
        {
          editorContainer,
          previewContainer,
          printControl,
          refreshControl,
          autoRefreshControl,
          statusContainer,
          downloadControl,
          loadControl,
        },
        createEditor,
        fakePaginate,
        printBook,
        { read: () => undefined, write: () => {} },
        downloadBook,
        loadBookFile,
      );

      window.__editor = editor;
    </script>
  </body>
</html>
